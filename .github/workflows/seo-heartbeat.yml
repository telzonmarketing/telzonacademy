name: SEO Heartbeat

# Runs every hour — quick site health probe.
# Logs result to public/seo-reports/activity.json so the dashboard's
# Activity Feed shows continuous activity between heavy daily audits.

on:
  schedule:
    - cron: '15 * * * *'   # every hour at :15 (offset from main workflow runs)
  workflow_dispatch:

jobs:
  heartbeat:
    name: Heartbeat
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!contains(github.event.head_commit.message, 'chore(seo):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: seo-indexing-agent
        run: npm install --omit=optional

      - name: Run heartbeat check
        working-directory: seo-indexing-agent
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: node src/index.js heartbeat --url $SITE_URL || true

      - name: Log heartbeat to activity feed
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const path = 'seo-indexing-agent/heartbeat.json';
              if (!fs.existsSync(path)) {
                console.log('No heartbeat.json — skipping');
                return;
              }
              const hb = JSON.parse(fs.readFileSync(path, 'utf8'));

              fs.mkdirSync('public/seo-reports', { recursive: true });

              // Save latest heartbeat (used by dashboard's "Site Status" card)
              fs.writeFileSync('public/seo-reports/heartbeat.json', JSON.stringify(hb, null, 2));

              // Append entry to activity feed
              const actPath = 'public/seo-reports/activity.json';
              const activities = fs.existsSync(actPath)
                ? JSON.parse(fs.readFileSync(actPath, 'utf8'))
                : [];

              const failedItems = (hb.results || []).filter(r => !r.ok);
              activities.unshift({
                timestamp: hb.timestamp,
                type: hb.healthy ? 'heartbeat' : 'error',
                icon: hb.healthy ? '💚' : '🔴',
                title: hb.healthy
                  ? `Heartbeat: site healthy (${hb.passed}/${hb.totalChecks} checks · ${hb.avgResponseMs}ms avg)`
                  : `Heartbeat: ${failedItems.length} check(s) failing`,
                details: hb.healthy
                  ? ''
                  : failedItems.map(f => `${f.status || 'ERR'} ${f.name}`).join(' · '),
              });

              fs.writeFileSync(actPath, JSON.stringify(activities.slice(0, 200), null, 2));

              // Commit + push
              const { execSync } = require('child_process');
              execSync('git config user.name "SEO Bot"');
              execSync('git config user.email "seo-bot@telzonacademy.in"');
              execSync('git add public/seo-reports/');
              try {
                execSync('git diff --cached --quiet || git commit -m "chore(seo): heartbeat"');
                execSync('git push');
              } catch (e) { console.log('Push:', e.message); }
            } catch (e) { console.log('Heartbeat log error:', e.message); }

      - name: Deploy heartbeat data to Hostinger
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port:     65002
          source:   "public/seo-reports/"
          target:   ${{ secrets.FTP_SERVER_DIR }}
          strip_components: 1
          timeout:  60s
        continue-on-error: true
