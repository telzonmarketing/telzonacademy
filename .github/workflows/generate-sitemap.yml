name: Generate & Deploy Sitemap

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual sitemap update'
  schedule:
    # Also regenerate sitemap weekly (Sunday midnight UTC)
    - cron: '0 0 * * 0'

jobs:
  generate-sitemap:
    name: Fetch blogs from Supabase & regenerate sitemap.xml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pip install -q requests

      - name: Fetch published blogs and generate sitemap
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python3 tools/generate_sitemap.py

      - name: Commit and push updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to sitemap"
          else
            git commit -m "chore: auto-update sitemap.xml [skip ci]"
            git push
          fi

      - name: Ping Google with new sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://telzonacademy.in/sitemap.xml" -o /dev/null
          echo "✅ Google pinged with updated sitemap"
