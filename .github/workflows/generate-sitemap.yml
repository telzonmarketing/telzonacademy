name: Generate & Deploy Sitemap

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual sitemap update'
  schedule:
    # Also regenerate sitemap weekly (Sunday midnight UTC)
    - cron: '0 0 * * 0'

jobs:
  generate-sitemap:
    name: Fetch blogs from Supabase & regenerate sitemap.xml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Same builder the deploy uses: homepage, core pages, EVERY landing page in
      # src/pages/landingPagesConfig.js (courses + all locality pages) and every
      # published blog post. Never drops pages that exist on the site.
      - name: Generate sitemap from site config + published blogs
        run: node tools/sitemap.js public/sitemap.xml
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Commit and push updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to sitemap"
          else
            git commit -m "chore: auto-update sitemap.xml [skip ci]"
            git push
          fi

      # Google retired sitemap pings in 2023; Search Console reads sitemap.xml
      # directly. Bing and other engines are notified via IndexNow on deploy.
