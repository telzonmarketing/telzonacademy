name: SEO Indexing Agent

on:
  schedule:
    - cron: '0 8 * * *'   # Run daily at 8am UTC
  push:
    branches: [main]       # Also run on every deploy
  workflow_dispatch:       # Allow manual trigger from GitHub UI

jobs:
  seo-audit:
    name: Audit & Submit
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Allow bot to commit/push report JSON to public/seo-reports/
    # Skip if the commit was made by this bot to prevent infinite loops
    if: "!contains(github.event.head_commit.message, 'chore(seo):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: seo-indexing-agent
        run: npm install

      - name: Run SEO audit & submit
        working-directory: seo-indexing-agent
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MAX_CRAWL_PAGES: 1000
          AUTO_SUBMIT: true
        run: node src/index.js run --url $SITE_URL || true

      - name: Save report to dashboard
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const reportPath = 'seo-indexing-agent/full-report.json';
              if (!fs.existsSync(reportPath)) return;
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

              // Save latest.json
              fs.mkdirSync('public/seo-reports', { recursive: true });
              fs.writeFileSync('public/seo-reports/latest.json', JSON.stringify(report, null, 2));

              // Append to history.json
              const histPath = 'public/seo-reports/history.json';
              const history = fs.existsSync(histPath) ? JSON.parse(fs.readFileSync(histPath, 'utf8')) : [];
              const entry = {
                timestamp: report.timestamp || new Date().toISOString(),
                pagesFound: report.summary?.pagesFound || 0,
                critical: report.summary?.critical || 0,
                important: report.summary?.important || 0,
                fixed: report.summary?.fixed || 0,
                submitted: report.summary?.submitted || 0,
              };
              history.unshift(entry);
              fs.writeFileSync(histPath, JSON.stringify(history.slice(0, 60), null, 2));

              // Git commit
              const { execSync } = require('child_process');
              execSync('git config user.name "SEO Bot"');
              execSync('git config user.email "seo-bot@telzonacademy.in"');
              execSync('git add public/seo-reports/');
              try {
                execSync('git diff --cached --quiet || git commit -m "chore(seo): update dashboard report [skip ci]"');
                execSync('git push');
                console.log('Dashboard updated successfully!');
              } catch (pushErr) {
                console.log('Push result:', pushErr.message);
              }
            } catch (e) { console.log('Report save error:', e.message); }

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-report-${{ github.run_number }}
          path: |
            seo-indexing-agent/full-report.json
            seo-indexing-agent/report.html
          retention-days: 30
