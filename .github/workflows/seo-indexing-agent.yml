name: SEO Indexing Agent

on:
  schedule:
    - cron: '0 2 * * *'    # 02:00 UTC = 07:30 IST — Full daily audit
    - cron: '0 6 * * *'    # 06:00 UTC = 11:30 IST — Submit fresh pages
    - cron: '0 10 * * *'   # 10:00 UTC = 15:30 IST — Submit fresh pages
    - cron: '0 14 * * *'   # 14:00 UTC = 19:30 IST — Submit fresh pages
    - cron: '0 18 * * *'   # 18:00 UTC = 23:30 IST — Submit fresh pages
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: full (audit+fix+submit+rank) or submit (submit only)'
        required: false
        default: 'full'

jobs:
  seo-audit:
    name: SEO Agent — ${{ github.event_name == 'schedule' && (github.event.schedule == '0 2 * * *' && 'Full Audit' || 'Quick Submit') || inputs.mode || 'Full' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!contains(github.event.head_commit.message, 'chore(seo):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: seo-indexing-agent
        run: npm install

      # ── FULL MODE: audit + fix + submit + keyword rank (daily at 02:00 UTC) ──
      - name: Run full SEO pipeline
        if: |
          github.event.schedule == '0 2 * * *' ||
          github.event_name == 'workflow_dispatch' && inputs.mode != 'submit' ||
          github.event_name == 'push'
        working-directory: seo-indexing-agent
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MAX_CRAWL_PAGES: 1000
          AUTO_SUBMIT: true
        run: node src/index.js run --url $SITE_URL || true

      # ── SUBMIT MODE: only submit updated pages (every 4h at 06/10/14/18 UTC) ──
      - name: Run quick page submission
        if: |
          github.event.schedule == '0 6 * * *' ||
          github.event.schedule == '0 10 * * *' ||
          github.event.schedule == '0 14 * * *' ||
          github.event.schedule == '0 18 * * *' ||
          github.event_name == 'workflow_dispatch' && inputs.mode == 'submit'
        working-directory: seo-indexing-agent
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node src/index.js submit --url $SITE_URL || true

      # ── SAVE REPORTS TO DASHBOARD ──
      - name: Save report to dashboard
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const reportPath = 'seo-indexing-agent/full-report.json';
              if (!fs.existsSync(reportPath)) {
                console.log('No full-report.json — submit-only run, skipping dashboard update');
                return;
              }
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

              fs.mkdirSync('public/seo-reports', { recursive: true });

              // Save latest.json
              fs.writeFileSync('public/seo-reports/latest.json', JSON.stringify(report, null, 2));

              // Append to history.json
              const histPath = 'public/seo-reports/history.json';
              const history = fs.existsSync(histPath) ? JSON.parse(fs.readFileSync(histPath, 'utf8')) : [];
              const entry = {
                timestamp: report.timestamp || new Date().toISOString(),
                pagesFound: report.summary?.pagesFound || 0,
                critical: report.summary?.critical || 0,
                important: report.summary?.important || 0,
                fixed: report.summary?.issuesFixed || 0,
                submitted: report.summary?.pagesSubmitted || 0,
                avgPosition: report.summary?.avgPosition || null,
                totalKeywords: report.summary?.totalKeywords || 0,
              };
              history.unshift(entry);
              fs.writeFileSync(histPath, JSON.stringify(history.slice(0, 90), null, 2));

              // Save keywords.json (latest rankings + rolling 90-day history)
              const kwPath = 'public/seo-reports/keywords.json';
              const kwData = fs.existsSync(kwPath)
                ? JSON.parse(fs.readFileSync(kwPath, 'utf8'))
                : { latest: [], history: [] };
              if (report.keywords && report.keywords.length > 0) {
                kwData.latest = report.keywords;
                kwData.summary = report.keywordSummary || {};
                kwData.history.unshift({
                  timestamp: report.timestamp,
                  avgPosition: report.summary?.avgPosition || null,
                  totalKeywords: report.summary?.totalKeywords || 0,
                  improved: report.keywordSummary?.improved || 0,
                  dropped: report.keywordSummary?.dropped || 0,
                });
                kwData.history = kwData.history.slice(0, 90);
                fs.writeFileSync(kwPath, JSON.stringify(kwData, null, 2));
              }

              // ── ACTIVITY FEED: log every action the bot took this run ──
              const actPath = 'public/seo-reports/activity.json';
              const activities = fs.existsSync(actPath)
                ? JSON.parse(fs.readFileSync(actPath, 'utf8'))
                : [];
              const ts = report.timestamp || new Date().toISOString();
              const runMode = process.env.GITHUB_EVENT_NAME === 'schedule' ? 'scheduled' : 'manual';

              // 1) Run started
              activities.unshift({
                timestamp: ts,
                type: 'run',
                icon: '▶',
                title: `SEO bot ${runMode} run started`,
                details: `Mode: full audit + fix + submit + keyword tracking`,
              });

              // 2) Crawl completed
              if (report.summary?.pagesFound > 0) {
                activities.unshift({
                  timestamp: ts,
                  type: 'crawl',
                  icon: '🕷',
                  title: `Crawled ${report.summary.pagesFound} pages`,
                  details: `Found ${report.summary.issuesFound || 0} issues (${report.summary.critical || 0} critical, ${report.summary.important || 0} important)`,
                });
              }

              // 3) Each fix applied (one entry per fix)
              if (report.fixes && report.fixes.length > 0) {
                for (const fix of report.fixes) {
                  activities.unshift({
                    timestamp: ts,
                    type: 'fix',
                    icon: '🔧',
                    title: `Auto-fixed: ${fix.title || fix.issue || 'issue'}`,
                    details: fix.description || fix.file || '',
                  });
                }
              }

              // 4) Pages submitted to Google
              if (report.summary?.pagesSubmitted > 0) {
                activities.unshift({
                  timestamp: ts,
                  type: 'submit',
                  icon: '🚀',
                  title: `Submitted ${report.summary.pagesSubmitted} pages to Google Indexing API`,
                  details: (report.submitted || []).slice(0, 3).join(', ') + (report.submitted?.length > 3 ? ` + ${report.submitted.length - 3} more` : ''),
                });
              }

              // 5) Keyword tracking results
              if (report.summary?.totalKeywords > 0) {
                const ks = report.keywordSummary || {};
                activities.unshift({
                  timestamp: ts,
                  type: 'rank',
                  icon: '📊',
                  title: `Tracked ${report.summary.totalKeywords} keywords from GSC`,
                  details: `Avg position: ${report.summary.avgPosition} · ↑${ks.improved || 0} improved · ↓${ks.dropped || 0} dropped · ${ks.opportunities?.length || 0} on cusp of page 1`,
                });

                // Top movers — log each separately so the user sees the wins
                for (const k of (ks.topGainers || []).slice(0, 5)) {
                  activities.unshift({
                    timestamp: ts,
                    type: 'rank-up',
                    icon: '📈',
                    title: `"${k.query}" moved up ${k.change} positions → now #${k.position}`,
                    details: '',
                  });
                }
              } else if (process.env.GOOGLE_SERVICE_ACCOUNT_KEY) {
                activities.unshift({
                  timestamp: ts,
                  type: 'rank',
                  icon: '⏳',
                  title: `Keyword tracking: no data yet`,
                  details: 'GSC needs 2-3 days of data after API enable to populate rankings',
                });
              }

              // 6) Broken links
              if (report.brokenLinks && report.brokenLinks.length > 0) {
                const unique = [...new Set(report.brokenLinks.map(b => b.to))];
                activities.unshift({
                  timestamp: ts,
                  type: 'error',
                  icon: '🔗',
                  title: `Found ${unique.length} broken link${unique.length === 1 ? '' : 's'} on the site`,
                  details: unique.slice(0, 3).join(' · ') + (unique.length > 3 ? ` + ${unique.length - 3} more` : ''),
                });
              }

              // 7) Content briefs — opportunities to push keywords to page 1
              if (report.contentBriefs && report.contentBriefs.length > 0) {
                activities.unshift({
                  timestamp: ts,
                  type: 'brief',
                  icon: '💡',
                  title: `Generated ${report.contentBriefs.length} content optimisation brief${report.contentBriefs.length === 1 ? '' : 's'}`,
                  details: `Top opportunity: "${report.contentBriefs[0].query}" at #${report.contentBriefs[0].currentPosition} — +${report.contentBriefs[0].estimatedTrafficGain} clicks/mo potential`,
                });
              }

              // 8) Errors if any
              for (const err of (report.errors || [])) {
                activities.unshift({
                  timestamp: ts,
                  type: 'error',
                  icon: '⚠',
                  title: 'Run encountered an error',
                  details: err,
                });
              }

              // Run completed
              activities.unshift({
                timestamp: new Date().toISOString(),
                type: 'done',
                icon: '✓',
                title: 'Run completed',
                details: `Total: ${report.summary?.pagesFound || 0} pages · ${report.summary?.issuesFixed || 0} fixes · ${report.summary?.pagesSubmitted || 0} submitted`,
              });

              // Keep last 200 activities (rolling window — enough for ~1 month of runs)
              fs.writeFileSync(actPath, JSON.stringify(activities.slice(0, 200), null, 2));

              // Git commit + push (triggers deploy.yml → files reach Hostinger)
              const { execSync } = require('child_process');
              execSync('git config user.name "SEO Bot"');
              execSync('git config user.email "seo-bot@telzonacademy.in"');
              execSync('git add public/seo-reports/');
              try {
                execSync('git diff --cached --quiet || git commit -m "chore(seo): update dashboard report"');
                execSync('git push');
                console.log('✓ Dashboard data committed and pushed — deploy will follow');
              } catch (pushErr) {
                console.log('Push result:', pushErr.message);
              }
            } catch (e) { console.log('Report save error:', e.message); }

      # ── DEPLOY JSON FILES DIRECTLY TO HOSTINGER (no rebuild needed) ──
      - name: Deploy SEO reports to Hostinger
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port:     65002
          source:   "public/seo-reports/"
          target:   ${{ secrets.FTP_SERVER_DIR }}
          strip_components: 1
          timeout:  60s
        continue-on-error: true

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-report-${{ github.run_number }}
          path: |
            seo-indexing-agent/full-report.json
          retention-days: 30
