name: SEO AEO Agent

# Answer Engine Optimization — runs daily.
# Refreshes llms.txt + llms-full.txt, audits AI-crawler friendliness,
# generates FAQ schema suggestions, probes AI visibility.

on:
  schedule:
    - cron: '45 4 * * *'   # 04:45 UTC = 10:15 IST — runs after AI monitor
  workflow_dispatch:

jobs:
  aeo:
    name: AEO Run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!contains(github.event.head_commit.message, 'chore(seo):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: seo-indexing-agent
        run: npm install --omit=optional

      - name: Run AEO agent
        working-directory: seo-indexing-agent
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: node src/index.js aeo --url $SITE_URL || true

      - name: Log AEO results to activity feed
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              const reportPath = 'public/seo-reports/aeo-report.json';
              if (!fs.existsSync(reportPath)) return;
              const r = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

              const actPath = 'public/seo-reports/activity.json';
              const acts = fs.existsSync(actPath) ? JSON.parse(fs.readFileSync(actPath, 'utf8')) : [];

              acts.unshift({
                timestamp: r.timestamp,
                type: 'aeo',
                icon: '🤖',
                title: `AEO scan complete · Score ${r.score}/100 (${r.grade})`,
                details: `${r.aiCrawlers?.length || 0} AI crawlers allowed · ${r.faqSuggestions?.length || 0} FAQ schemas suggested · ${r.visibility?.citingCount || 0}/${r.visibility?.checked || 0} engines citing site`,
              });

              for (const issue of (r.issues || []).slice(0, 5)) {
                acts.unshift({
                  timestamp: r.timestamp,
                  type: issue.severity === 'critical' ? 'error' : 'fix',
                  icon: '🤖',
                  title: `AEO issue (${issue.severity}): ${issue.title}`,
                  details: issue.details || '',
                });
              }

              fs.writeFileSync(actPath, JSON.stringify(acts.slice(0, 200), null, 2));

              const { execSync } = require('child_process');
              execSync('git config user.name "SEO Bot"');
              execSync('git config user.email "seo-bot@telzonacademy.in"');
              execSync('git add public/seo-reports/ public/llms.txt public/llms-full.txt 2>/dev/null || true');
              try {
                execSync('git diff --cached --quiet || git commit -m "chore(seo): aeo scan + refreshed llms.txt"');
                execSync('git push');
              } catch(e) { console.log('Push:', e.message); }
            } catch(e) { console.log('AEO log error:', e.message); }

      - name: Deploy AEO artifacts to Hostinger
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port:     65002
          source:   "public/llms.txt,public/llms-full.txt,public/robots.txt,public/seo-reports/"
          target:   ${{ secrets.FTP_SERVER_DIR }}
          strip_components: 1
          timeout:  60s
        continue-on-error: true
