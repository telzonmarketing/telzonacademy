name: SEO 7-Day Blitz

# Aggressive submission mode — runs every 2 hours, force-resubmits all pages
# to both Google Indexing API + IndexNow (Bing/Yandex). Use for the first
# week after launching a site or fixing major SEO issues, when you need
# to push for fast indexation across all search engines.

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:

jobs:
  blitz:
    name: Aggressive Submit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: "!contains(github.event.head_commit.message, 'chore(seo):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: seo-indexing-agent
        run: npm install --omit=optional

      - name: Force submit all pages (Google + IndexNow)
        working-directory: seo-indexing-agent
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: node src/index.js submit --url $SITE_URL --force || true

      - name: Log to activity feed
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            try {
              fs.mkdirSync('public/seo-reports', { recursive: true });
              const actPath = 'public/seo-reports/activity.json';
              const acts = fs.existsSync(actPath) ? JSON.parse(fs.readFileSync(actPath, 'utf8')) : [];
              acts.unshift({
                timestamp: new Date().toISOString(),
                type: 'submit',
                icon: '⚡',
                title: '7-day blitz: force-submitted all pages to Google + Bing/Yandex',
                details: 'Aggressive 2-hourly resubmission active for fast indexation',
              });
              fs.writeFileSync(actPath, JSON.stringify(acts.slice(0, 200), null, 2));
              const { execSync } = require('child_process');
              execSync('git config user.name "SEO Bot"');
              execSync('git config user.email "seo-bot@telzonacademy.in"');
              execSync('git add public/seo-reports/');
              try {
                execSync('git diff --cached --quiet || git commit -m "chore(seo): blitz submit"');
                execSync('git push');
              } catch(e) { console.log('Push:', e.message); }
            } catch(e) { console.log('Log error:', e.message); }

      - name: Deploy to Hostinger
        if: always()
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port:     65002
          source:   "public/seo-reports/"
          target:   ${{ secrets.FTP_SERVER_DIR }}
          strip_components: 1
          timeout:  60s
        continue-on-error: true
