name: Daily SEO Brain — Audit, Crawl & Indexing

on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST every day
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site URL to audit'
        required: false
        default: 'https://telzonacademy.in'

jobs:
  seo-brain:
    name: Advanced SEO audit and crawl
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SITE_URL: ${{ github.event.inputs.site_url || 'https://telzonacademy.in' }}
      INDEXNOW_ENABLED: ${{ secrets.INDEXNOW_KEY != '' }}
      GOOGLE_INDEXING_ENABLED: ${{ secrets.GOOGLE_INDEXING_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Advanced SEO Brain audit
        run: npm run seo:brain
        env:
          FAIL_ON_CRITICAL: 'false'

      - name: Upload SEO Brain reports
        uses: actions/upload-artifact@v4
        with:
          name: seo-brain-report
          path: seo-reports/
          retention-days: 30

      - name: Add SEO report to job summary
        run: cat seo-reports/seo-brain-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ping Google sitemap
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://www.google.com/ping?sitemap=${SITE_URL}/sitemap.xml")
          echo "Google ping: $STATUS"

      - name: Ping Bing sitemap
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://www.bing.com/ping?sitemap=${SITE_URL}/sitemap.xml")
          echo "Bing ping: $STATUS"

      - name: Submit sitemap URLs to IndexNow
        if: ${{ env.INDEXNOW_ENABLED == 'true' }}
        run: |
          pip install -q requests
          python3 << 'PYEOF'
          import os, re, requests

          site_url = os.environ["SITE_URL"].rstrip("/")
          host = site_url.replace("https://", "").replace("http://", "").split("/")[0]
          key = os.environ["INDEXNOW_KEY"]
          sitemap = open("public/sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>\s*([^<]+)\s*</loc>", sitemap)

          payload = {
            "host": host,
            "key": key,
            "keyLocation": f"{site_url}/{key}.txt",
            "urlList": urls[:10000],
          }
          response = requests.post("https://api.indexnow.org/indexnow", json=payload, timeout=30)
          print(f"IndexNow: {response.status_code} {response.text[:300]}")
          PYEOF
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Google Instant Indexing API (if key is set)
        if: ${{ env.GOOGLE_INDEXING_ENABLED == 'true' }}
        run: |
          pip install -q google-auth requests
          python3 << 'PYEOF'
          import json, os
          from google.oauth2 import service_account
          import google.auth.transport.requests, requests as req

          KEY = json.loads(os.environ['GOOGLE_INDEXING_KEY'])
          creds = service_account.Credentials.from_service_account_info(KEY, scopes=["https://www.googleapis.com/auth/indexing"])
          creds.refresh(google.auth.transport.requests.Request())
          h = {"Authorization": f"Bearer {creds.token}", "Content-Type": "application/json"}

          PRIORITY = [
            f"{os.environ['SITE_URL'].rstrip('/')}/",
            f"{os.environ['SITE_URL'].rstrip('/')}/pages/digital-marketing-course-in-nagpur",
            f"{os.environ['SITE_URL'].rstrip('/')}/pages/digital-marketing-institute-in-nagpur",
            f"{os.environ['SITE_URL'].rstrip('/')}/pages/best-digital-marketing-course-in-nagpur",
            f"{os.environ['SITE_URL'].rstrip('/')}/pages/digital-marketing-course-with-placement-nagpur",
            f"{os.environ['SITE_URL'].rstrip('/')}/pages/online-digital-marketing-course-nagpur",
            f"{os.environ['SITE_URL'].rstrip('/')}/pages/digital-marketing-internship-in-nagpur",
          ]
          for url in PRIORITY:
            r = req.post("https://indexing.googleapis.com/v3/urlNotifications:publish",
              headers=h, data=json.dumps({"url": url, "type": "URL_UPDATED"}))
            print(f"  {r.status_code}  {url}")
          PYEOF
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}

      - name: Done
        run: echo "SEO Brain complete — $(date)"
