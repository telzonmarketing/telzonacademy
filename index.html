    Gemini) and crawlers that don't execute JavaScript. React-helmet adds
    additional per-route schemas at runtime — Google merges all of them.

    These boost the AEO score by satisfying:
      - "0% of pages have structured data" (now has JSON-LD in static HTML)
      - "No Organization/EducationalOrganization schema found"

    NOTE: FAQPage is deliberately NOT static here. index.html is the shell for
    every route, so a static FAQPage would duplicate the per-route FAQPage that
    each React page emits (homepage FAQ.jsx + /pages/* LandingPage.jsx), which
    Google flags as invalid FAQ items. FAQ schema is therefore emitted per-route
    by React (matching each page's visible FAQ); AI crawlers get the FAQ content
    via llms.txt / llms-full.txt.
  -->
